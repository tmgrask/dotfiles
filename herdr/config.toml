onboarding = false

[keys]
prefix = "ctrl+a"
# pane navigation is already vim-style by default: prefix+h/j/k/l

# Project sessionizer, same muscle memory as the tmux setup
[[keys.command]]
key = "ctrl+t"
type = "popup"
command = "herdr-sessionizer"
description = "session"
width = "60%"
height = "50%"

[theme]
name = "catppuccin"

# Match Pi's basalt-bloom background while retaining Herdr's Catppuccin accents.
[theme.custom]
panel_bg = "#06070a"

[ui]
agent_panel_sort = "spaces"
